<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zari Admin</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<div id="adminGate" class="admin-gate">
  <div class="admin-gate-art">
    <img src="assets/logo.png" alt="Zari">
    <p>Every saree, every order, every story &mdash; in one place.</p>
  </div>
  <div class="admin-gate-form">
    <div class="admin-gate-box">
      <p class="eyebrow">Zari Admin</p>
      <h1 class="display">Sign <em>in</em></h1>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 32px;">Use your admin account to continue.</p>
      <form id="adminLoginForm">
        <div class="field"><label for="adminEmail">Email</label><input type="email" required id="adminEmail" autocomplete="email"></div>
        <div class="field"><label for="adminPassword">Password</label><input type="password" required id="adminPassword" autocomplete="current-password"></div>
        <div class="field-error hidden" id="adminLoginError"></div>
        <button class="btn btn-primary btn-block" type="submit">Log In</button>
      </form>
    </div>
  </div>
</div>

<div id="adminApp" class="admin-app hidden">
  <aside class="admin-sidebar">
    <div class="admin-brand"><img src="assets/logo.png" alt="Zari"><span>Admin</span></div>
    <nav id="adminNav">
      <a href="#/admin/dashboard" data-admin-link data-key="dashboard">Dashboard</a>
      <a href="#/admin/banners" data-admin-link data-key="banners">Banners</a>
      <a href="#/admin/products" data-admin-link data-key="products">Products</a>
      <a href="#/admin/orders" data-admin-link data-key="orders">Orders</a>
      <a href="#/admin/customers" data-admin-link data-key="customers">Customers</a>
      <a href="#/admin/categories" data-admin-link data-key="categories">Categories</a>
      <a href="#/admin/collections" data-admin-link data-key="collections">Collections</a>
      <a href="#/admin/campaigns" data-admin-link data-key="campaigns">Campaigns & Offers</a>
      <a href="#/admin/reviews" data-admin-link data-key="reviews">Reviews</a>
    </nav>
    <button class="link-btn" id="adminLogoutBtn">Log Out</button>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar"><h2 id="adminPageTitle">Dashboard</h2><a href="index.html" target="_blank" rel="noopener">View store &nearr;</a></header>
    <div class="admin-content" id="adminContent"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
